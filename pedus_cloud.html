<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PedusCloud Gaming</title>
    <style>
        /*
        ═══════════════════════════════════════════════════════
        PEDUS CLOUD GAMING - PREMIUM UI
        
        Diseño: Glassmorphism + Neón + Futurista
        Tema: Oscuro con acentos cian/esmeralda
        ═══════════════════════════════════════════════════════
        */

        /* ── Fuentes de Google ── */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

        /* ── Variables de diseño ── */
        :root {
            --accent: #00f5d4;
            --accent2: #00bbf9;
            --accent3: #9b5de5;
            --danger: #f15bb5;
            --warning: #fee440;

            --bg-deep: #0a0a0f;
            --bg-dark: #12121a;
            --bg-card: rgba(18, 18, 26, 0.65);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --bg-glass-hover: rgba(255, 255, 255, 0.06);

            --border: rgba(255, 255, 255, 0.08);
            --border-active: rgba(0, 245, 212, 0.3);

            --text: #f0f0f5;
            --text2: #8888a0;
            --text3: #55556a;

            --font: 'Inter', -apple-system, system-ui, sans-serif;
            --mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        /* ── Reset ── */
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: var(--font);
            background: var(--bg-deep);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ── Fondo animado con gradientes ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(800px 600px at 20% 30%, rgba(0,245,212,0.04), transparent),
                radial-gradient(600px 800px at 80% 70%, rgba(155,93,229,0.04), transparent),
                radial-gradient(900px 500px at 50% 50%, rgba(0,187,249,0.02), transparent);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 12s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* ── Patrón de grid sutil ── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Barra superior ── */
        #top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(10,10,15,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: var(--bg-deep);
            box-shadow: 0 0 12px rgba(0,245,212,0.3);
        }

        .logo-text {
            font-weight: 700;
            font-size: 15px;
        }

        .logo-text span {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .latency {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text2);
        }

        .latency strong {
            color: var(--accent);
            font-weight: 600;
        }

        .badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            font-size: 12px;
            font-weight: 500;
            font-family: var(--mono);
        }

        .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--text3);
            transition: all 0.3s;
        }

        .badge.on .dot {
            background: var(--accent);
            box-shadow: 0 0 8px rgba(0,245,212,0.5);
            animation: pulse 2s infinite;
        }

        .badge.loading .dot {
            background: var(--warning);
            box-shadow: 0 0 8px rgba(254,228,64,0.5);
            animation: pulse 0.8s infinite;
        }

        .badge.err .dot {
            background: var(--danger);
            box-shadow: 0 0 8px rgba(241,91,181,0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Contenedor de vídeo ── */
        #video-wrap {
            position: relative;
            z-index: 1;
            width: calc(100% - 40px);
            max-width: 1400px;
            height: calc(100% - 112px);
            margin-top: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video-box {
            position: relative;
            width: 100%; height: 100%;
            border-radius: 24px;
            overflow: hidden;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.25,0.8,0.25,1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video-box.active {
            border-color: var(--border-active);
            box-shadow:
                0 0 20px rgba(0,245,212,0.15),
                0 0 60px rgba(0,245,212,0.05),
                0 20px 60px rgba(0,0,0,0.5);
        }

        /* Borde gradiente animado cuando activo */
        #video-box.active::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(
                135deg,
                rgba(0,245,212,0.2),
                transparent 40%,
                transparent 60%,
                rgba(155,93,229,0.2)
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
        }

        #stream {
            width: 100%; height: 100%;
            object-fit: contain;
            background: #000;
            border-radius: 24px;
            cursor: crosshair;
        }

        #stream.mode3d {
            cursor: none;
        }

        /* ── Placeholder (antes de conectar) ── */
        #placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 5;
            transition: all 0.4s;
        }

        #placeholder.gone {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        .ph-icon {
            width: 80px; height: 80px;
            border-radius: 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .ph-text {
            text-align: center;
        }

        .ph-text h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .ph-text p {
            font-size: 13px;
            color: var(--text2);
            max-width: 320px;
            line-height: 1.5;
        }

        /* ── Input de URL + Botón ── */
        #connect-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 440px;
        }

        .url-row {
            display: flex;
            width: 100%;
            gap: 8px;
        }

        .url-input {
            flex: 1;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text);
            font-family: var(--mono);
            font-size: 12px;
            outline: none;
            transition: all 0.25s;
        }

        .url-input::placeholder {
            color: var(--text3);
        }

        .url-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,245,212,0.1);
        }

        .btn-go {
            padding: 11px 28px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: var(--bg-deep);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .btn-go::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        .btn-go:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,245,212,0.3);
        }

        .btn-go:hover::before {
            transform: translateX(100%);
        }

        .btn-go:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .hint {
            font-size: 11px;
            color: var(--text3);
            text-align: center;
        }

        .hint a {
            color: var(--accent);
            text-decoration: none;
        }

        /* ── Spinner de carga ── */
        .spin {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Panel de control inferior ── */
        #panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(18,18,26,0.8);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), bottom 0.4s;
        }

        #panel.show {
            opacity: 1;
            pointer-events: all;
        }

        .sep {
            width: 1px;
            height: 28px;
            background: var(--border);
            margin: 0 4px;
        }

        .grp {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .lbl {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text3);
            margin-right: 4px;
            white-space: nowrap;
        }

        .pbtn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-glass);
            color: var(--text2);
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .pbtn:hover {
            background: var(--bg-glass-hover);
            color: var(--text);
        }

        .pbtn.on {
            background: rgba(0,245,212,0.12);
            color: var(--accent);
            border-color: rgba(0,245,212,0.25);
        }

        .ibtn {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-glass);
            color: var(--text2);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .ibtn:hover {
            background: var(--bg-glass-hover);
            color: var(--text);
        }

        .ibtn.on {
            background: rgba(0,245,212,0.12);
            color: var(--accent);
        }

        .ibtn.red:hover {
            background: rgba(241,91,181,0.12);
            color: var(--danger);
            border-color: rgba(241,91,181,0.25);
        }

        .mtog {
            display: flex;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .mtog .pbtn {
            border: none;
            border-radius: 0;
        }

        .mtog .pbtn:first-child {
            border-right: 1px solid var(--border);
        }

        /* ── Toasts (notificaciones) ── */
        #toasts {
            position: fixed;
            top: 64px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            padding: 10px 16px;
            border-radius: 12px;
            background: rgba(18,18,26,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: tin 0.3s ease-out;
            max-width: 360px;
        }

        .toast.out {
            animation: tout 0.3s ease-in forwards;
        }

        @keyframes tin {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes tout {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(30px); }
        }

        /* ── Stats overlay ── */
        #stats {
            position: fixed;
            top: 62px; left: 20px;
            padding: 12px 16px;
            background: rgba(10,10,15,0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: var(--mono);
            font-size: 11px;
            line-height: 1.7;
            color: var(--text2);
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s;
            min-width: 180px;
        }

        #stats.show {
            opacity: 1;
            pointer-events: all;
        }

        .sr {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .sv {
            color: var(--accent);
            font-weight: 600;
        }

        /* ── Fullscreen ── */
        :fullscreen #top-bar { display: none; }
        :fullscreen #video-wrap { margin-top: 0; height: 100%; max-width: 100%; width: 100%; }
        :fullscreen #video-box { border-radius: 0; border: none; }
        :fullscreen #stream { border-radius: 0; }
        :fullscreen #panel { bottom: 10px; opacity: 0; }
        :fullscreen #panel:hover, :fullscreen #panel.show { opacity: 1; }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            #panel {
                bottom: 10px;
                padding: 6px 8px;
                gap: 4px;
                flex-wrap: wrap;
                max-width: calc(100% - 20px);
                justify-content: center;
            }
            .lbl { display: none; }
            #video-wrap { width: calc(100% - 16px); }
        }

        ::-webkit-scrollbar { display: none; }
        ::selection { background: rgba(0,245,212,0.2); color: var(--accent); }
    </style>
</head>
<body>

    <div id="toasts"></div>

    <div id="stats">
        <div class="sr"><span>RTT</span><span class="sv" id="s-rtt">--</span></div>
        <div class="sr"><span>Jitter</span><span class="sv" id="s-jit">--</span></div>
        <div class="sr"><span>Bitrate</span><span class="sv" id="s-bit">--</span></div>
        <div class="sr"><span>FPS</span><span class="sv" id="s-fps">--</span></div>
        <div class="sr"><span>Resolución</span><span class="sv" id="s-res">--</span></div>
        <div class="sr"><span>Paquetes</span><span class="sv" id="s-pkt">--</span></div>
    </div>

    <div id="top-bar">
        <div class="logo">
            <div class="logo-icon">P</div>
            <div class="logo-text"><span>Pedus</span>Cloud</div>
        </div>
        <div class="status-area">
            <div class="latency" id="lat">RTT: <strong>--</strong> ms</div>
            <div class="badge" id="badge">
                <div class="dot"></div>
                <span id="badge-txt">Desconectado</span>
            </div>
        </div>
    </div>

    <div id="video-wrap">
        <div id="video-box">
            <video id="stream" autoplay playsinline muted></video>

            <div id="placeholder">
                <div class="ph-icon">🎮</div>
                <div class="ph-text">
                    <h2>PedusCloud Gaming</h2>
                    <p>Conecta a tu PC de casa y juega desde cualquier lugar con latencia ultra-baja vía WebRTC.</p>
                </div>
                <div id="connect-area">
                    <div class="url-row">
                        <input
                            type="text"
                            class="url-input"
                            id="url"
                            placeholder="https://tu-url.ngrok-free.app"
                            spellcheck="false"
                            autocomplete="off"
                        />
                        <button class="btn-go" id="btn-go" onclick="App.connect()">
                            ⚡ Conectar
                        </button>
                    </div>
                    <div class="hint">
                        Pega la URL que te da <a href="https://ngrok.com" target="_blank">ngrok</a> 
                        al ejecutar <code>ngrok http 8080</code> en tu PC
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="panel">
        <div class="grp">
            <span class="lbl">RES</span>
            <button class="pbtn" data-res="480p" onclick="App.res('480p')">480p</button>
            <button class="pbtn on" data-res="720p" onclick="App.res('720p')">720p</button>
            <button class="pbtn" data-res="1080p" onclick="App.res('1080p')">1080p</button>
            <button class="pbtn" data-res="4k_cine" onclick="App.res('4k_cine')" style="border-color: rgba(155,93,229,0.5); color: #b794f4;">🎬 4K Cine</button>
        </div>
        <div class="sep"></div>
        <div class="grp">
            <span class="lbl">FPS</span>
            <button class="pbtn" data-fps="24" onclick="App.fps(24)">24</button>
            <button class="pbtn" data-fps="30" onclick="App.fps(30)">30</button>
            <button class="pbtn on" data-fps="60" onclick="App.fps(60)">60</button>
        </div>
        <div class="sep"></div>
        <div class="grp">
            <span class="lbl">MODE</span>
            <div class="mtog">
                <button class="pbtn on" data-mode="2d" onclick="App.mode('2d')">🖱 2D</button>
                <button class="pbtn" data-mode="3d" onclick="App.mode('3d')">🎮 3D</button>
            </div>
        </div>
        <div class="sep"></div>
        <div class="grp">
            <button class="ibtn" id="btn-stats" onclick="App.stats()" title="Stats">📊</button>
            <button class="ibtn" onclick="App.fullscreen()" title="Fullscreen">⛶</button>
            <button class="ibtn red" onclick="App.disconnect()" title="Desconectar">⏻</button>
        </div>
    </div>

    <script>
    /*
    ══════════════════════════════════════════════════════════════
    PEDUS CLOUD GAMING - MOTOR DEL CLIENTE
    ══════════════════════════════════════════════════════════════
    */

    const App = (() => {
        'use strict';

        // ═══════════════════════════
        //  ESTADO DE LA APLICACIÓN
        // ═══════════════════════════

        const S = {
            pc: null,           // RTCPeerConnection
            dc: null,           // DataChannel (para inputs)
            url: '',            // URL del servidor
            connected: false,
            connecting: false,
            mode: '2d',         // '2d' o '3d'
            locked: false,      // Pointer Lock activo
            statsOn: false,
            statsTimer: null,
            pingTime: 0,
            prevBytes: 0,
            prevTime: 0,
            menuTimer: null,    // Temporizador de inactividad para el menú
            menuVisible: false  // Estado de visibilidad actual
        };

        // ═══════════════
        //  HELPERS DOM
        // ═══════════════

        const $ = id => document.getElementById(id);

        // ═══════════════
        //  TOASTS
        // ═══════════════

        function toast(msg, icon = 'ℹ️', ms = 3500) {
            const c = $('toasts');
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
            c.appendChild(t);
            setTimeout(() => {
                t.classList.add('out');
                setTimeout(() => t.remove(), 300);
            }, ms);
        }

        // ═══════════════════════
        //  ACTUALIZAR UI STATUS
        // ═══════════════════════

        function setStatus(cls, txt) {
            $('badge').className = `badge ${cls}`;
            $('badge-txt').textContent = txt;
        }

        // ═══════════════════════════════════════
        //  CONTROL DE INACTIVIDAD DEL PANEL UI
        // ═══════════════════════════════════════
        
        function resetMenuTimer() {
            if (!S.connected) return;

            if (!S.menuVisible) {
                $('panel').classList.add('show');
                S.menuVisible = true;
            }

            if (S.menuTimer) clearTimeout(S.menuTimer);

            S.menuTimer = setTimeout(() => {
                // Si el puntero del ratón está justo encima del menú, posponemos el ocultado
                if ($('panel').matches(':hover')) {
                    resetMenuTimer();
                    return;
                }
                $('panel').classList.remove('show');
                S.menuVisible = false;
            }, 3000); // 3 segundos de gracia
        }

        // ═══════════════════════════════════════
        //  CONECTAR (WebRTC Signaling)
        // ═══════════════════════════════════════

        async function connect() {
            if (S.connecting || S.connected) return;

            let url = $('url').value.trim();
            if (!url) {
                toast('Escribe la URL de ngrok', '⚠️');
                $('url').focus();
                return;
            }

            url = url.replace(/\/+$/, '');

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            S.url = url;
            S.connecting = true;

            localStorage.setItem('pedus_url', url);

            setStatus('loading', 'Conectando...');
            const btn = $('btn-go');
            btn.disabled = true;
            btn.innerHTML = '<span class="spin"></span>Conectando';
            toast('Conectando con el servidor...', '🔄');

            try {
                S.pc = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                    ],
                });

                S.dc = S.pc.createDataChannel('inputs', {
                    ordered: false,
                    maxRetransmits: 0,
                });

                S.dc.onopen = () => {
                    console.log('📡 DataChannel abierto');
                    toast('Canal de inputs activo', '📡');
                    startPing();
                };

                S.dc.onmessage = (e) => {
                    try {
                        const d = JSON.parse(e.data);
                        if (d.type === 'pong') {
                            const rtt = Date.now() - S.pingTime;
                            $('lat').innerHTML = `RTT: <strong>${rtt}</strong> ms`;
                        } else if (d.type === 'config_ack') {
                            toast(`${d.setting}: ${d.value}`, '✅');
                        }
                    } catch(err) {}
                };

                S.pc.ontrack = (e) => {
                    if (e.track.kind === 'video') {
                        console.log('🎬 Stream de vídeo recibido');
                        const vid = $('stream');
                        vid.srcObject = e.streams[0];
                        vid.play().catch(() => {});

                        $('placeholder').classList.add('gone');
                        $('video-box').classList.add('active');
                        
                        S.connected = true;
                        S.connecting = false;
                        setStatus('on', 'Conectado');
                        toast('¡Conectado! Viendo tu escritorio', '🎮');

                        // Mostrar panel inicial y arrancar temporizador inteligente
                        resetMenuTimer();

                        bindInputs();
                        startStats();
                    }
                };

                S.pc.oniceconnectionstatechange = () => {
                    const st = S.pc.iceConnectionState;
                    console.log('🧊 ICE:', st);
                    if (st === 'disconnected' || st === 'failed') {
                        toast('Conexión perdida', '⚠️');
                        setStatus('err', 'Desconectado');
                        cleanup();
                    }
                };

                S.pc.onconnectionstatechange = () => {
                    if (S.pc.connectionState === 'failed' || S.pc.connectionState === 'closed') {
                        cleanup();
                    }
                };

                S.pc.addTransceiver('video', { direction: 'recvonly' });

                const offer = await S.pc.createOffer();
                await S.pc.setLocalDescription(offer);

                await new Promise(resolve => {
                    if (S.pc.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        S.pc.addEventListener('icegatheringstatechange', function check() {
                            if (S.pc.iceGatheringState === 'complete') {
                                S.pc.removeEventListener('icegatheringstatechange', check);
                                resolve();
                            }
                        });
                        setTimeout(resolve, 5000);
                    }
                });

                console.log('📤 Enviando oferta a:', url + '/offer');

                const resp = await fetch(url + '/offer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true',
                    },
                    body: JSON.stringify({
                        sdp: S.pc.localDescription.sdp,
                        type: S.pc.localDescription.type,
                    }),
                });

                if (!resp.ok) {
                    const txt = await resp.text();
                    throw new Error(`Servidor respondió ${resp.status}: ${txt}`);
                }

                const answer = await resp.json();

                if (answer.error) {
                    throw new Error(answer.error);
                }

                await S.pc.setRemoteDescription(new RTCSessionDescription({
                    sdp: answer.sdp,
                    type: answer.type,
                }));

                console.log('✅ Signaling completado. Sesión:', answer.session_id);

            } catch (err) {
                console.error('❌ Error:', err);
                toast(`Error: ${err.message}`, '❌', 6000);
                setStatus('err', 'Error');
                S.connecting = false;
                cleanup();
                btn.disabled = false;
                btn.innerHTML = '⚡ Conectar';
            }
        }

        // ═══════════════════
        //  DESCONECTAR
        // ═══════════════════

        function cleanup() {
            S.connected = false;
            S.connecting = false;
            S.locked = false;

            unbindInputs();

            if (S.menuTimer) { clearTimeout(S.menuTimer); S.menuTimer = null; }
            S.menuVisible = false;

            if (S.statsTimer) { clearInterval(S.statsTimer); S.statsTimer = null; }
            if (S.dc) { try { S.dc.close(); } catch(e){} S.dc = null; }
            if (S.pc) { try { S.pc.close(); } catch(e){} S.pc = null; }

            $('stream').srcObject = null;
            $('placeholder').classList.remove('gone');
            $('video-box').classList.remove('active');
            $('panel').classList.remove('show');
            $('stats').classList.remove('show');

            const btn = $('btn-go');
            btn.disabled = false;
            btn.innerHTML = '⚡ Conectar';

            setStatus('', 'Desconectado');
            $('lat').innerHTML = 'RTT: <strong>--</strong> ms';
        }

        function disconnect() {
            toast('Desconectado', '👋');
            cleanup();
            if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
            if (document.pointerLockElement) document.exitPointerLock();
        }

        // ═══════════════════════════════
        //  ENVIAR INPUT POR DATACHANNEL
        // ═══════════════════════════════

        function send(data) {
            if (S.dc && S.dc.readyState === 'open') {
                try { S.dc.send(JSON.stringify(data)); } catch(e) {}
            }
        }

        // ═══════════════════════════════════════
        //  PING (Medición de latencia)
        // ═══════════════════════════════════════

        function startPing() {
            setInterval(() => {
                if (S.dc && S.dc.readyState === 'open') {
                    S.pingTime = Date.now();
                    send({ type: 'ping', t: S.pingTime });
                }
            }, 2000);
        }

        // ═══════════════════════════════════════════
        //  CALCULAR POSICIÓN DEL RATÓN SOBRE EL VÍDEO
        // ═══════════════════════════════════════════

        function videoPos(clientX, clientY) {
            const v = $('stream');
            const r = v.getBoundingClientRect();
            const vw = v.videoWidth || 1280;
            const vh = v.videoHeight || 720;
            const cw = r.width;
            const ch = r.height;
            const va = vw / vh;
            const ca = cw / ch;

            let rw, rh, ox, oy;

            if (ca > va) {
                rh = ch;
                rw = ch * va;
                ox = (cw - rw) / 2;
                oy = 0;
            } else {
                rw = cw;
                rh = cw / va;
                ox = 0;
                oy = (ch - rh) / 2;
            }

            const rx = (clientX - r.left - ox) / rw;
            const ry = (clientY - r.top - oy) / rh;

            return {
                px: Math.max(0, Math.min(1, rx)),
                py: Math.max(0, Math.min(1, ry)),
                ok: rx >= 0 && rx <= 1 && ry >= 0 && ry <= 1,
            };
        }

        // ═══════════════════════════════════════
        //  VINCULAR EVENTOS DE INPUT
        // ═══════════════════════════════════════

        let H = {};

        function bindInputs() {
            const v = $('stream');

            // Detectar interacción para mantener visible el panel
            H.menuActivity = () => {
                resetMenuTimer();
            };
            window.addEventListener('mousemove', H.menuActivity);
            window.addEventListener('click', H.menuActivity);

            // ── RATÓN: MOVIMIENTO ──
            H.mousemove = (e) => {
                if (S.mode === '3d' && S.locked) {
                    send({ type: 'mousemove_3d', dx: e.movementX, dy: e.movementY, sensitivity: 1.0 });
                } else if (S.mode === '2d') {
                    const p = videoPos(e.clientX, e.clientY);
                    if (p.ok) send({ type: 'mousemove_2d', px: p.px, py: p.py });
                }
            };

            // ── RATÓN: CLIC ──
            H.mousedown = (e) => {
                if (S.mode === '3d' && !S.locked) {
                    v.requestPointerLock();
                    return;
                }

                const d = { type: 'mousedown', button: e.button };

                if (S.mode === '2d') {
                    const p = videoPos(e.clientX, e.clientY);
                    d.px = p.px;
                    d.py = p.py;
                }

                send(d);
                e.preventDefault();
            };

            H.mouseup = (e) => {
                send({ type: 'mouseup', button: e.button });
                e.preventDefault();
            };

            // ── RATÓN: SCROLL ──
            H.wheel = (e) => {
                send({ type: 'scroll', deltaY: e.deltaY });
                e.preventDefault();
            };

            // ── TECLADO ──
            const BLOCK = ['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','Backspace','Enter'];

            H.keydown = (e) => {
                // Atajo Shift + Escape para Forzar Ocultación / Visibilidad del Menú
                if (e.shiftKey && e.code === 'Escape') {
                    e.preventDefault();
                    if (S.menuVisible) {
                        if (S.menuTimer) clearTimeout(S.menuTimer);
                        $('panel').classList.remove('show');
                        S.menuVisible = false;
                        toast('Menú ocultado', '🙈', 1500);
                    } else {
                        resetMenuTimer();
                        toast('Menú visible', '👀', 1500);
                    }
                    return;
                }

                if (e.key === 'F11') return;
                if (e.ctrlKey && ['r','w','t','l','n','shift'].includes(e.key.toLowerCase())) return;

                if (BLOCK.includes(e.code)) e.preventDefault();

                send({ type: 'keydown', code: e.code, key: e.key });
            };

            H.keyup = (e) => {
                if (e.key === 'F11') return;
                e.preventDefault();
                send({ type: 'keyup', code: e.code, key: e.key });
            };

            H.ctx = (e) => e.preventDefault();

            H.plock = () => {
                S.locked = document.pointerLockElement === v;
                if (S.locked) {
                    toast('Ratón capturado. Pulsa ESC para salir.', '🔒');
                    v.classList.add('mode3d');
                } else {
                    v.classList.remove('mode3d');
                    if (S.mode === '3d') toast('Clic en el vídeo para recapturar', '🔓');
                }
            };

            v.addEventListener('mousemove', H.mousemove);
            v.addEventListener('mousedown', H.mousedown);
            v.addEventListener('mouseup', H.mouseup);
            v.addEventListener('wheel', H.wheel, { passive: false });
            v.addEventListener('contextmenu', H.ctx);
            document.addEventListener('keydown', H.keydown);
            document.addEventListener('keyup', H.keyup);
            document.addEventListener('pointerlockchange', H.plock);
        }

        function unbindInputs() {
            const v = $('stream');
            if (!H.mousemove) return;

            window.removeEventListener('mousemove', H.menuActivity);
            window.removeEventListener('click', H.menuActivity);

            v.removeEventListener('mousemove', H.mousemove);
            v.removeEventListener('mousedown', H.mousedown);
            v.removeEventListener('mouseup', H.mouseup);
            v.removeEventListener('wheel', H.wheel);
            v.removeEventListener('contextmenu', H.ctx);
            document.removeEventListener('keydown', H.keydown);
            document.removeEventListener('keyup', H.keyup);
            document.removeEventListener('pointerlockchange', H.plock);

            if (document.pointerLockElement) document.exitPointerLock();
            H = {};
        }

        // ═══════════════════════════════════════
        //  CONTROLES DEL PANEL
        // ═══════════════════════════════════════

        function res(v) {
            if (v === '4k_cine') {
                toast('Modo Cine 4K: Ajustando stream a 24 FPS para máxima fidelidad visual', '🎬', 4000);
                fps(24); // Baja dinámicamente los FPS a 24 estándar de cine
            }
            send({ type: 'resolution', value: v });
            document.querySelectorAll('[data-res]').forEach(b => b.classList.toggle('on', b.dataset.res === v));
        }

        function fps(v) {
            send({ type: 'fps', value: v });
            document.querySelectorAll('[data-fps]').forEach(b => b.classList.toggle('on', b.dataset.fps === String(v)));
        }

        function mode(m) {
            S.mode = m;
            document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));

            if (m === '2d') {
                if (document.pointerLockElement) document.exitPointerLock();
                $('stream').classList.remove('mode3d');
                toast('Modo 2D: Escritorio', '🖱');
            } else {
                toast('Modo 3D: Clic en el vídeo para capturar ratón', '🎮');
            }
        }

        function fullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {
                    toast('Fullscreen no disponible', '⚠️');
                });
            } else {
                document.exitFullscreen();
            }
        }

        function stats() {
            S.statsOn = !S.statsOn;
            $('stats').classList.toggle('show', S.statsOn);
            $('btn-stats').classList.toggle('on', S.statsOn);
        }

        // ═══════════════════════════════
        //  ESTADÍSTICAS WebRTC
        // ═══════════════════════════════

        function startStats() {
            S.prevTime = Date.now();
            S.prevBytes = 0;

            S.statsTimer = setInterval(async () => {
                if (!S.pc) return;
                try {
                    const st = await S.pc.getStats();
                    let rtt='-', jit='-', fps='-', res='-', bytes=0, pkts=0;

                    st.forEach(r => {
                        if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.currentRoundTripTime !== undefined) {
                            rtt = Math.round(r.currentRoundTripTime * 1000);
                        }
                        if (r.type === 'inbound-rtp' && r.kind === 'video') {
                            if (r.jitter !== undefined) jit = (r.jitter * 1000).toFixed(1) + ' ms';
                            if (r.framesPerSecond !== undefined) fps = Math.round(r.framesPerSecond);
                            if (r.frameWidth && r.frameHeight) res = r.frameWidth + 'x' + r.frameHeight;
                            if (r.bytesReceived !== undefined) bytes = r.bytesReceived;
                            if (r.packetsReceived !== undefined) pkts = r.packetsReceived;
                        }
                    });

                    const now = Date.now();
                    const dt = (now - S.prevTime) / 1000;
                    let bit = '-';
                    if (dt > 0 && S.prevBytes > 0) {
                        const bps = ((bytes - S.prevBytes) * 8) / dt;
                        bit = bps > 1e6 ? (bps/1e6).toFixed(1)+' Mbps' : (bps/1e3).toFixed(0)+' kbps';
                    }
                    S.prevBytes = bytes;
                    S.prevTime = now;

                    if (rtt !== '-') $('lat').innerHTML = `RTT: <strong>${rtt}</strong> ms`;
                    $('s-rtt').textContent = rtt !== '-' ? rtt+' ms' : '-';
                    $('s-jit').textContent = jit;
                    $('s-bit').textContent = bit;
                    $('s-fps').textContent = fps;
                    $('s-res').textContent = res;
                    $('s-pkt').textContent = pkts.toLocaleString();
                } catch(e) {}
            }, 1500);
        }

        // ═══════════════════════════════
        //  INICIALIZACIÓN
        // ═══════════════════════════════

        function init() {
            console.log('%c PedusCloud Gaming v2.1 ',
                'background:linear-gradient(135deg,#00f5d4,#00bbf9);color:#0a0a0f;font-weight:bold;font-size:14px;padding:4px 8px;border-radius:4px;');

            const saved = localStorage.getItem('pedus_url');
            if (saved) {
                $('url').value = saved;
            }

            $('url').addEventListener('input', () => {
                const v = $('url').value.trim();
                if (v) localStorage.setItem('pedus_url', v);
            });

            $('url').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') connect();
            });

            window.addEventListener('beforeunload', () => {
                if (S.connected) cleanup();
            });

            toast('PedusCloud Gaming listo', '🎮');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        return { connect, disconnect, res, fps, mode, fullscreen, stats };
    })();
    </script>
</body>
</html>
