<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <title>PedusCloud Gaming | Premium</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&display=swap');

        :root {
            --color-bg-base: #F8F6F0;
            --color-bg-panel: #FFFFFF;
            --color-bg-glass: rgba(255, 255, 255, 0.6);
            --color-bg-glass-hover: rgba(255, 255, 255, 0.9);
            --color-bg-toast: rgba(255, 255, 255, 0.95);
            --color-bg-video: #EAE6DE;
            
            --color-text-main: #3D342B;
            --color-text-muted: #8C7B6B;
            --color-text-inverse: #FFFFFF;
            
            --color-accent-primary: #D46A4C;
            --color-accent-hover: #BF5A3E;
            --color-accent-secondary: #E39B7C;
            --color-success: #4CAF50;
            --color-warning: #FF9800;
            --color-danger: #E53935;
            
            --border-color: rgba(212, 106, 76, 0.15);
            --border-color-active: rgba(212, 106, 76, 0.5);
            --border-width: 1px;
            
            --shadow-sm: 0 4px 12px rgba(140, 123, 107, 0.08);
            --shadow-md: 0 12px 35px rgba(140, 123, 107, 0.12);
            --shadow-lg: 0 24px 60px rgba(140, 123, 107, 0.15);
            --shadow-neon: 0 0 0px transparent;
            
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-pill: 9999px;
            
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --blur-amount: 24px;
            --transition-speed-fast: 0.15s;
            --transition-speed-normal: 0.3s;
            --transition-speed-slow: 0.5s;
            --transition-easing: cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        [data-theme="gamer"] {
            --color-bg-base: #09090B;
            --color-bg-panel: rgba(18, 18, 24, 0.85);
            --color-bg-glass: rgba(255, 255, 255, 0.05);
            --color-bg-glass-hover: rgba(255, 255, 255, 0.1);
            --color-bg-toast: rgba(18, 18, 24, 0.95);
            --color-bg-video: #000000;
            
            --color-text-main: #FFFFFF;
            --color-text-muted: #A1A1AA;
            --color-text-inverse: #FFFFFF;
            
            --color-accent-primary: #F43F5E;
            --color-accent-hover: #E11D48;
            --color-accent-secondary: #8B5CF6;
            --color-success: #10B981;
            --color-warning: #F59E0B;
            --color-danger: #EF4444;
            
            --border-color: rgba(244, 63, 94, 0.2);
            --border-color-active: rgba(244, 63, 94, 0.6);
            
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 12px 35px rgba(0, 0, 0, 0.7);
            --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.9);
            --shadow-neon: 0 0 20px rgba(244, 63, 94, 0.3), 0 0 40px rgba(244, 63, 94, 0.1);
            
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
        }

        [data-theme="matrix"] {
            --color-bg-base: #000000;
            --color-bg-panel: rgba(0, 15, 0, 0.9);
            --color-bg-glass: rgba(0, 255, 65, 0.05);
            --color-bg-glass-hover: rgba(0, 255, 65, 0.15);
            --color-bg-toast: rgba(0, 20, 0, 0.95);
            --color-bg-video: #000000;
            
            --color-text-main: #00FF41;
            --color-text-muted: #008F11;
            --color-text-inverse: #000000;
            
            --color-accent-primary: #00FF41;
            --color-accent-hover: #39FF14;
            --color-accent-secondary: #00FF41;
            --color-success: #00FF41;
            --color-warning: #FFD700;
            --color-danger: #FF0000;
            
            --border-color: rgba(0, 255, 65, 0.4);
            --border-color-active: rgba(0, 255, 65, 0.8);
            
            --shadow-sm: 0 0 10px rgba(0, 255, 65, 0.1);
            --shadow-md: 0 0 20px rgba(0, 255, 65, 0.2);
            --shadow-lg: 0 0 40px rgba(0, 255, 65, 0.3);
            --shadow-neon: 0 0 15px rgba(0, 255, 65, 0.4);
            
            --radius-sm: 2px;
            --radius-md: 4px;
            --radius-lg: 8px;
            --radius-xl: 12px;
            
            --font-sans: 'Share Tech Mono', 'JetBrains Mono', monospace;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-sans);
            background-color: var(--color-bg-base);
            color: var(--color-text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color var(--transition-speed-slow) var(--transition-easing),
                        color var(--transition-speed-slow) var(--transition-easing);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(var(--border-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 80px 80px;
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background-color: var(--color-bg-panel);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border-bottom: var(--border-width) solid var(--border-color);
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-speed-normal) var(--transition-easing);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--color-accent-primary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-inverse);
            font-weight: 800;
            font-size: 16px;
            box-shadow: var(--shadow-neon);
        }

        .logo-text {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
            color: var(--color-text-main);
        }

        .logo-text span {
            color: var(--color-accent-primary);
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .theme-selector {
            display: flex;
            background-color: var(--color-bg-glass);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-pill);
            padding: 4px;
        }

        .theme-btn {
            background: transparent;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--color-text-muted);
            transition: all var(--transition-speed-fast) ease;
        }

        .theme-btn:hover {
            color: var(--color-text-main);
            background-color: var(--color-bg-glass-hover);
        }

        .theme-btn.active {
            background-color: var(--color-accent-primary);
            color: var(--color-text-inverse);
            box-shadow: var(--shadow-sm);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            background-color: var(--color-bg-glass);
            border: var(--border-width) solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-mono);
            color: var(--color-text-main);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--color-text-muted);
            transition: background-color var(--transition-speed-normal);
        }

        .status-badge.connected .status-dot {
            background-color: var(--color-success);
            box-shadow: 0 0 10px var(--color-success);
        }

        .status-badge.connecting .status-dot {
            background-color: var(--color-warning);
            animation: pulse-dot 1s infinite;
        }

        @keyframes pulse-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .latency-text {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--color-text-muted);
        }

        .latency-text strong {
            color: var(--color-accent-primary);
        }

        .main-workspace {
            position: relative;
            z-index: 1;
            width: calc(100% - 64px);
            max-width: 1600px;
            height: calc(100% - 140px);
            margin-top: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: var(--radius-lg);
            background-color: var(--color-bg-video);
            border: var(--border-width) solid var(--border-color);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-speed-normal) var(--transition-easing);
        }

        .video-container.is-active {
            border-color: var(--color-accent-primary);
            box-shadow: var(--shadow-lg), var(--shadow-neon);
        }

        .stream-element {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000000;
            border-radius: calc(var(--radius-lg) - 2px);
            cursor: crosshair;
        }

        .stream-element.mode-3d-active {
            cursor: none;
        }

        .setup-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            z-index: 5;
            background-color: var(--color-bg-panel);
            border-radius: calc(var(--radius-lg) - 2px);
            transition: opacity var(--transition-speed-slow), transform var(--transition-speed-slow);
        }

        .setup-screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
        }

        .setup-icon-wrapper {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-md);
            background-color: var(--color-bg-glass);
            border: var(--border-width) solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-accent-primary);
            animation: float-icon 6s ease-in-out infinite;
        }

        .setup-icon-wrapper svg {
            width: 48px;
            height: 48px;
            fill: currentColor;
        }

        @keyframes float-icon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .setup-typography {
            text-align: center;
        }

        .setup-typography h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--color-text-main);
        }

        .setup-typography p {
            font-size: 15px;
            color: var(--color-text-muted);
            max-width: 400px;
            line-height: 1.6;
        }

        .connection-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 480px;
        }

        .input-group {
            display: flex;
            width: 100%;
            gap: 12px;
        }

        .server-input {
            flex: 1;
            padding: 16px 20px;
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: var(--color-bg-glass);
            color: var(--color-text-main);
            font-family: var(--font-mono);
            font-size: 14px;
            outline: none;
            transition: all var(--transition-speed-fast);
        }

        .server-input::placeholder {
            color: var(--color-text-muted);
            opacity: 0.6;
        }

        .server-input:focus {
            border-color: var(--color-accent-primary);
            box-shadow: 0 0 0 4px rgba(212, 106, 76, 0.1);
            background-color: var(--color-bg-panel);
        }

        [data-theme="gamer"] .server-input:focus {
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15);
        }

        [data-theme="matrix"] .server-input:focus {
            box-shadow: 0 0 0 4px rgba(0, 255, 65, 0.2);
        }

        .btn-primary {
            padding: 16px 32px;
            border: none;
            border-radius: var(--radius-md);
            background-color: var(--color-accent-primary);
            color: var(--color-text-inverse);
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-speed-normal);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background-color: var(--color-accent-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loader-spin {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin-anim 0.8s linear infinite;
            display: none;
        }

        .btn-primary.is-loading .loader-spin {
            display: inline-block;
        }
        
        .btn-primary.is-loading .btn-icon {
            display: none;
        }

        @keyframes spin-anim {
            to { transform: rotate(360deg); }
        }

        .helper-text {
            font-size: 12px;
            color: var(--color-text-muted);
            text-align: center;
        }

        .dashboard-overlay {
            position: fixed;
            inset: 0;
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-speed-normal) var(--transition-easing);
        }

        .dashboard-overlay.is-visible {
            opacity: 1;
            pointer-events: all;
        }

        .dashboard-backdrop {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .dashboard-modal {
            position: relative;
            background-color: var(--color-bg-panel);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 40px;
            width: 90%;
            max-width: 800px;
            box-shadow: var(--shadow-lg);
            transform: translateY(30px) scale(0.98);
            transition: all var(--transition-speed-normal) var(--transition-easing);
            max-height: 90vh;
            overflow-y: auto;
        }

        .dashboard-overlay.is-visible .dashboard-modal {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            font-size: 26px;
            font-weight: 800;
            color: var(--color-text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .modal-header h2 svg {
            width: 28px;
            height: 28px;
            fill: var(--color-accent-primary);
        }

        .modal-header p {
            font-size: 14px;
            color: var(--color-text-muted);
            margin-top: 8px;
        }

        .btn-close-modal {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--color-bg-glass);
            border: var(--border-width) solid var(--border-color);
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-speed-fast);
        }

        .btn-close-modal svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .btn-close-modal:hover {
            background-color: var(--color-bg-glass-hover);
            color: var(--color-text-main);
            transform: rotate(90deg);
        }

        .mobile-fab {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 2000;
            background-color: var(--color-bg-panel);
            border: var(--border-width) solid var(--border-color);
            color: var(--color-text-main);
            padding: 16px 24px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all var(--transition-speed-fast);
        }

        .mobile-fab svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .mobile-fab:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            color: var(--color-accent-primary);
        }

        body.is-connected .mobile-fab {
            display: flex;
        }

        :fullscreen .top-bar {
            transform: translateY(-100%);
        }
        :fullscreen .main-workspace {
            margin-top: 0;
            height: 100%;
            max-width: 100%;
            width: 100%;
        }
        :fullscreen .video-container {
            border-radius: 0;
            border: none;
        }
        :fullscreen .stream-element {
            border-radius: 0;
        }
        :fullscreen .mobile-fab {
            opacity: 0.1;
        }
        :fullscreen .mobile-fab:hover {
            opacity: 1;
        }

        .toast-container {
            position: fixed;
            top: 84px;
            right: 32px;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast-message {
            padding: 16px 24px;
            border-radius: var(--radius-md);
            background-color: var(--color-bg-toast);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: var(--border-width) solid var(--border-color);
            box-shadow: var(--shadow-md);
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-main);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: toast-slide-in 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            max-width: 400px;
        }

        .toast-message svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .toast-message.is-leaving {
            animation: toast-slide-out 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes toast-slide-in {
            from { opacity: 0; transform: translateX(50px) scale(0.9); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        @keyframes toast-slide-out {
            from { opacity: 1; transform: translateX(0) scale(1); }
            to { opacity: 0; transform: translateX(50px) scale(0.9); }
        }

        .stats-overlay {
            position: fixed;
            top: 84px;
            left: 32px;
            padding: 20px;
            background-color: var(--color-bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--color-text-muted);
            z-index: 2000;
            box-shadow: var(--shadow-md);
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-speed-normal);
            min-width: 220px;
        }

        .stats-overlay.is-visible {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo-container">
            <div class="logo-icon">P</div>
            <div class="logo-text">Pedus<span>Cloud</span></div>
        </div>
        <div class="top-controls">
            <div class="theme-selector">
                <button class="theme-btn active" data-theme="default" title="Minimalista">☀️</button>
                <button class="theme-btn" data-theme="gamer" title="Gamer">🎮</button>
                <button class="theme-btn" data-theme="matrix" title="Matrix">💚</button>
            </div>
            <div class="status-badge connecting">
                <div class="status-dot"></div>
                <span class="latency-text">Conectando... <strong>--ms</strong></span>
            </div>
        </div>
    </div>

    <div class="main-workspace">
        <div class="video-container">
            <canvas class="stream-element"></canvas>
            <div class="setup-screen">
                <div class="setup-icon-wrapper">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
                    </svg>
                </div>
                <div class="setup-typography">
                    <h1>Bienvenido a PedusCloud</h1>
                    <p>Configura tu servidor para comenzar a transmitir en la nube</p>
                </div>
                <form class="connection-form" id="connectionForm">
                    <div class="input-group">
                        <input type="text" class="server-input" id="serverInput" placeholder="ej: 192.168.1.100:8080" required>
                        <button type="submit" class="btn-primary">
                            <span class="btn-icon">🚀</span>
                            <span class="loader-spin"></span>
                            <span>Conectar</span>
                        </button>
                    </div>
                    <p class="helper-text">Ingresa la dirección IP y puerto de tu servidor</p>
                </form>
            </div>
        </div>
    </div>

    <div class="toast-container"></div>
    <div class="stats-overlay"></div>
    <button class="mobile-fab">🎮 Controles</button>

    <div class="dashboard-overlay">
        <div class="dashboard-backdrop"></div>
        <div class="dashboard-modal">
            <button class="btn-close-modal">✕</button>
            <div class="modal-header">
                <h2>⚙️ Panel de Control</h2>
                <p>Presiona <span class="keyboard-shortcut">Ctrl+Q</span> para cerrar</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // APLICACIÓN PRINCIPAL - App Class
        // ============================================
        class App {
            constructor() {
                this.theme = 'default';
                this.connected = false;
                this.latency = 0;
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.loadTheme();
            }

            setupEventListeners() {
                // Theme switcher
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => this.changeTheme(e.target.dataset.theme));
                });

                // Connection form
                document.getElementById('connectionForm')?.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleConnection();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'q') {
                        e.preventDefault();
                        this.toggleDashboard();
                    }
                });

                // Dashboard close button
                document.querySelector('.btn-close-modal')?.addEventListener('click', () => {
                    this.toggleDashboard();
                });

                // Mobile FAB
                document.querySelector('.mobile-fab')?.addEventListener('click', () => {
                    this.toggleDashboard();
                });
            }

            changeTheme(themeName) {
                this.theme = themeName;
                const themeValue = themeName === 'default' ? '' : themeName;
                document.documentElement.setAttribute('data-theme', themeValue);
                
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-theme="${themeName}"]`)?.classList.add('active');
                
                localStorage.setItem('theme', themeName);
            }

            loadTheme() {
                const savedTheme = localStorage.getItem('theme') || 'default';
                this.changeTheme(savedTheme);
            }

            async handleConnection() {
                const input = document.getElementById('serverInput');
                const button = document.querySelector('.btn-primary');
                const setupScreen = document.querySelector('.setup-screen');
                
                if (!input.value.trim()) {
                    this.showToast('Por favor ingresa una dirección válida', 'error');
                    return;
                }

                button.classList.add('is-loading');
                button.disabled = true;

                try {
                    // Simular conexión
                    await this.simulateConnection(input.value);
                    
                    this.connected = true;
                    document.body.classList.add('is-connected');
                    setupScreen.classList.add('hidden');
                    this.updateStatus('connected');
                    this.showToast('¡Conectado exitosamente!', 'success');
                } catch (error) {
                    this.showToast(`Error: ${error.message}`, 'error');
                    this.updateStatus('disconnected');
                } finally {
                    button.classList.remove('is-loading');
                    button.disabled = false;
                }
            }

            async simulateConnection(serverAddress) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        if (Math.random() > 0.3) {
                            this.latency = Math.floor(Math.random() * 100) + 20;
                            resolve();
                        } else {
                            reject(new Error('No se pudo conectar al servidor'));
                        }
                    }, 2000);
                });
            }

            updateStatus(status) {
                const badge = document.querySelector('.status-badge');
                if (!badge) return;

                badge.className = 'status-badge';
                badge.innerHTML = '';
                
                const dot = document.createElement('div');
                dot.className = 'status-dot';
                badge.appendChild(dot);

                const text = document.createElement('span');
                text.className = 'latency-text';

                if (status === 'connected') {
                    badge.classList.add('connected');
                    text.innerHTML = `Conectado <strong>${this.latency}ms</strong>`;
                } else if (status === 'connecting') {
                    badge.classList.add('connecting');
                    text.innerHTML = 'Conectando... <strong>--ms</strong>';
                } else {
                    text.innerHTML = 'Desconectado';
                }

                badge.appendChild(text);
            }

            showToast(message, type = 'info') {
                const container = document.querySelector('.toast-container');
                const toast = document.createElement('div');
                toast.className = `toast-message is-${type}`;
                
                const icons = {
                    success: '✓',
                    error: '✕',
                    info: 'ℹ'
                };

                toast.innerHTML = `
                    <span style="font-size: 18px;">${icons[type]}</span>
                    <span>${message}</span>
                `;

                container.appendChild(toast);

                setTimeout(() => {
                    toast.classList.add('is-leaving');
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            }

            toggleDashboard() {
                const overlay = document.querySelector('.dashboard-overlay');
                overlay?.classList.toggle('is-visible');
            }
        }

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            window.app = new App();
        });
    </script>
</body>
</html>
