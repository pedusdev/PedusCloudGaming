<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PedusCloud Gaming | Ultra Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0a0c;
            --accent-main: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.4);
            --accent-secondary: #00b8ff;
            --glass-bg: rgba(15, 15, 20, 0.7);
            --glass-border: rgba(255, 255, 255, 0.05);
            --text-main: #f0f0f0;
            --text-muted: #888899;
            --panel-width: 320px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* --- BACKGROUND Y ESTÉTICA GENERAL --- */
        .background-fx {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(10, 15, 25, 1) 0%, rgba(5, 5, 8, 1) 100%);
            z-index: -1;
        }
        
        .grid-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(var(--glass-border) 1px, transparent 1px),
                              linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.2;
            z-index: -1;
        }

        /* --- GAME CANVAS --- */
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #game-canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: crosshair;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            transition: filter 0.3s ease;
        }

        #game-canvas.blurred {
            filter: blur(8px) brightness(0.6);
        }

        /* --- MAIN CONNECTION PANEL --- */
        #connection-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            width: 350px;
            z-index: 100;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #connection-panel.hidden {
            opacity: 0;
            transform: translate(-50%, -60%) scale(0.95);
            pointer-events: none;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }
        .brand h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            margin: 0;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-main), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .brand p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 5px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* --- TOP HUD MENU (El menú flotante superior) --- */
        #top-hud {
            position: absolute;
            top: -100px; /* Hidden by default */
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 0 0 15px 15px;
            padding: 10px 20px;
            display: flex;
            gap: 20px;
            z-index: 200;
            transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #top-hud.visible {
            top: 0;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            padding: 5px 10px;
            border-radius: 8px;
        }
        .hud-item:hover {
            color: var(--accent-main);
            background: rgba(255,255,255,0.05);
        }
        .hud-item i {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        .hud-item span {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .hud-item.active {
            color: #ff3366;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { text-shadow: 0 0 0 rgba(255,51,102,0); }
            50% { text-shadow: 0 0 10px rgba(255,51,102,0.8); }
            100% { text-shadow: 0 0 0 rgba(255,51,102,0); }
        }

        /* --- CONTROLES Y FORMULARIOS --- */
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        
        input[type="text"], select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        input[type="text"]:focus, select:focus {
            border-color: var(--accent-main);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Custom Range Slider */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: var(--accent-main);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* Botones */
        .btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        .btn-primary {
            background: var(--accent-main);
            color: #000;
            border: none;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .btn-primary:hover {
            background: #00e67a;
            box-shadow: 0 0 25px var(--accent-glow);
        }
        .btn-play {
            background: linear-gradient(45deg, var(--accent-main), var(--accent-secondary));
            border: none;
            color: #000;
            font-weight: 700;
            margin-top: 15px;
            display: none;
        }

        /* Stream Link Copier */
        #stream-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            z-index: 300;
            text-align: center;
            width: 300px;
        }
        #stream-modal h3 { margin-top: 0; font-family: 'Rajdhani'; }
        .stream-link-box {
            background: #000; padding: 10px; border-radius: 6px;
            font-size: 0.8rem; word-break: break-all; margin: 15px 0;
            color: var(--accent-secondary); border: 1px dashed #333;
        }

        /* Notificaciones Toast */
        #toast {
            position: absolute;
            bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.8);
            color: white; padding: 12px 20px;
            border-left: 4px solid var(--accent-main);
            border-radius: 4px;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
            font-size: 0.85rem;
        }
        #toast.show { transform: translateX(0); }
        
        .shortcut-hint {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
        kbd {
            background: #222; border: 1px solid #444; border-radius: 3px;
            padding: 2px 5px; font-family: monospace; color: #ddd;
        }
    </style>
</head>
<body>

    <div class="background-fx"></div>
    <div class="grid-overlay"></div>

    <!-- MENÚ HUD SUPERIOR -->
    <div id="top-hud">
        <div class="hud-item" id="hud-menu" title="Volver al menú principal">
            <i class="fa-solid fa-bars"></i>
            <span>Menú</span>
        </div>
        <div class="hud-item" id="hud-screenshot" title="Capturar pantalla (C)">
            <i class="fa-solid fa-camera"></i>
            <span>Captura</span>
        </div>
        <div class="hud-item" id="hud-record" title="Grabar video local (R)">
            <i class="fa-solid fa-circle-dot"></i>
            <span>Grabar</span>
        </div>
        <div class="hud-item" id="hud-stream" title="Generar enlace de espectador (S)">
            <i class="fa-solid fa-broadcast-tower"></i>
            <span>Transmitir</span>
        </div>
        <div class="hud-item" id="hud-fullscreen" title="Pantalla Completa (F)">
            <i class="fa-solid fa-expand"></i>
            <span>Pantalla</span>
        </div>
    </div>

    <!-- PANEL PRINCIPAL DE CONEXIÓN -->
    <div id="connection-panel">
        <div class="brand">
            <h1>PedusCloud</h1>
            <p>Gaming en la Nube</p>
        </div>

        <div class="input-group">
            <label>IP del Host <span id="status-text" style="color:#ff3366">• Desconectado</span></label>
            <input type="text" id="server-ip" value="192.168.1.XX" placeholder="Tu IP Pública...">
        </div>

        <div class="input-group">
            <label>Resolución</label>
            <select id="res-select">
                <option value="1080p">1080p (FHD - Máxima Calidad)</option>
                <option value="720p" selected>720p (HD - Equilibrado)</option>
                <option value="440p">440p (SD - Fluidez Extrema)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Tasa de Bits (Calidad JPEG) <span id="quality-val">60%</span></label>
            <input type="range" id="quality-slider" min="10" max="100" value="60">
        </div>

        <button id="connect-btn" class="btn btn-primary"><i class="fa-solid fa-link"></i> Conectar al Host</button>
        <button id="play-btn" class="btn btn-play"><i class="fa-solid fa-gamepad"></i> Jugar Ahora</button>
    </div>

    <!-- MODAL STREAMING -->
    <div id="stream-modal">
        <h3><i class="fa-solid fa-broadcast-tower"></i> Modo Stream</h3>
        <p style="font-size:0.8rem; color:#aaa;">Comparte este enlace para que otros vean tu partida (Modo Espectador):</p>
        <div class="stream-link-box" id="stream-link-text">http://tu-github-pages.io/?spectate=192.168.1.XX</div>
        <button class="btn btn-primary" id="copy-stream-btn">Copiar Enlace</button>
        <button class="btn" style="margin-top:10px;" onclick="document.getElementById('stream-modal').style.display='none'">Cerrar</button>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="1280" height="720" class="blurred"></canvas>
    </div>

    <div id="toast">Acción realizada</div>
    
    <div class="shortcut-hint">Presiona <kbd>SHIFT</kbd> + <kbd>TAB</kbd> para abrir el menú HUD mientras juegas</div>

    <script>
        // --- Variables Globales ---
        let ws = null;
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        // Elementos UI
        const panel = document.getElementById('connection-panel');
        const topHud = document.getElementById('top-hud');
        const connectBtn = document.getElementById('connect-btn');
        const playBtn = document.getElementById('play-btn');
        const statusText = document.getElementById('status-text');
        
        let isPlaying = false;
        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isSpectatorMode = false;

        // Comprobar si entramos como espectador por URL (ej: ?spectate=192.168.1.33)
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.has('spectate')) {
            isSpectatorMode = true;
            document.getElementById('server-ip').value = urlParams.get('spectate');
            document.getElementById('server-ip').disabled = true;
            document.querySelector('.brand p').innerText = "Modo Espectador";
            playBtn.innerHTML = '<i class="fa-solid fa-eye"></i> Ver Partida';
        }

        // --- Utilidades UI ---
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.getElementById('quality-slider').addEventListener('input', (e) => {
            document.getElementById('quality-val').textContent = e.target.value + '%';
            sendConfig();
        });

        document.getElementById('res-select').addEventListener('change', () => {
            const res = document.getElementById('res-select').value;
            if(res === '1080p') { canvas.width = 1920; canvas.height = 1080; }
            if(res === '720p') { canvas.width = 1280; canvas.height = 720; }
            if(res === '440p') { canvas.width = 782; canvas.height = 440; }
            sendConfig();
        });

        // --- CONEXIÓN WEB-SOCKET ---
        connectBtn.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
                return;
            }

            const ip = document.getElementById('server-ip').value;
            const wsUrl = `ws://${ip}:8080/ws`;
            
            connectBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Conectando...';
            
            try {
                ws = new WebSocket(wsUrl);
                ws.binaryType = 'blob';

                ws.onopen = () => {
                    statusText.innerHTML = '<span style="color:var(--accent-main)">• Conectado</span>';
                    connectBtn.innerHTML = '<i class="fa-solid fa-unlink"></i> Desconectar';
                    playBtn.style.display = "flex";
                    
                    // Si es espectador, mandamos config especial para no enviar inputs
                    if(isSpectatorMode) ws.send(JSON.stringify({ type: "spectator_join" }));
                    else sendConfig();
                };

                ws.onclose = () => {
                    statusText.innerHTML = '<span style="color:#ff3366">• Desconectado</span>';
                    connectBtn.innerHTML = '<i class="fa-solid fa-link"></i> Conectar al Host';
                    playBtn.style.display = "none";
                    canvas.classList.add('blurred');
                    if (isPlaying) document.exitPointerLock();
                };

                ws.onerror = (err) => {
                    showToast("Error de conexión. Revisa IP/Firewall.");
                    connectBtn.innerHTML = '<i class="fa-solid fa-link"></i> Conectar al Host';
                };

                // Render rápido
                ws.onmessage = async (event) => {
                    if (event.data instanceof Blob) {
                        createImageBitmap(event.data).then(imgBitmap => {
                            ctx.drawImage(imgBitmap, 0, 0, canvas.width, canvas.height);
                            imgBitmap.close();
                        }).catch(e => {});
                    }
                };
            } catch (e) {
                showToast("Formato de IP inválido");
            }
        });

        function sendConfig() {
            if (ws && ws.readyState === WebSocket.OPEN && !isSpectatorMode) {
                ws.send(JSON.stringify({
                    type: "config",
                    resolution: document.getElementById('res-select').value,
                    quality: parseInt(document.getElementById('quality-slider').value)
                }));
            }
        }

        // --- INGRESO AL JUEGO ---
        playBtn.addEventListener('click', async () => {
            panel.classList.add('hidden');
            canvas.classList.remove('blurred');
            
            if(!isSpectatorMode) {
                try {
                    await canvas.requestPointerLock();
                } catch (e) {
                    showToast("Haz clic en la pantalla para jugar");
                }
            } else {
                showToast("Viendo partida en vivo...");
            }
        });

        // HUD TOGGLE (Shift + Tab)
        window.addEventListener('keydown', (e) => {
            if (e.shiftKey && e.key === 'Tab') {
                e.preventDefault();
                topHud.classList.toggle('visible');
                // Salir del juego momentáneamente para usar el menú
                if(isPlaying && topHud.classList.contains('visible')) document.exitPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === canvas) {
                isPlaying = true;
                topHud.classList.remove('visible');
            } else {
                isPlaying = false;
                if(!panel.classList.contains('hidden') === false) { // Si el panel no está visible, mostramos hud
                    topHud.classList.add('visible');
                }
            }
        });

        // --- FUNCIONALIDADES DEL HUD ---

        // 1. Volver al menú
        document.getElementById('hud-menu').addEventListener('click', () => {
            topHud.classList.remove('visible');
            panel.classList.remove('hidden');
            canvas.classList.add('blurred');
        });

        // 2. Captura de pantalla
        function takeScreenshot() {
            const dataURL = canvas.toDataURL("image/jpeg", 1.0);
            const link = document.createElement("a");
            link.download = `PedusCloud_Shot_${new Date().getTime()}.jpg`;
            link.href = dataURL;
            link.click();
            showToast("Captura guardada");
        }
        document.getElementById('hud-screenshot').addEventListener('click', takeScreenshot);

        // 3. Grabar Video local
        document.getElementById('hud-record').addEventListener('click', function() {
            if(!isRecording) {
                const stream = canvas.captureStream(30); // 30 FPS
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `PedusCloud_Record_${new Date().getTime()}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    showToast("Video guardado localmente");
                };
                
                mediaRecorder.start();
                isRecording = true;
                this.classList.add('active');
                showToast("Grabación iniciada");
            } else {
                mediaRecorder.stop();
                isRecording = false;
                this.classList.remove('active');
            }
        });

        // 4. Modo Stream (Generar enlace)
        document.getElementById('hud-stream').addEventListener('click', () => {
            const currentUrl = window.location.origin + window.location.pathname;
            const ip = document.getElementById('server-ip').value;
            const streamLink = `${currentUrl}?spectate=${ip}`;
            document.getElementById('stream-link-text').innerText = streamLink;
            document.getElementById('stream-modal').style.display = 'block';
        });

        document.getElementById('copy-stream-btn').addEventListener('click', () => {
            const text = document.getElementById('stream-link-text').innerText;
            navigator.clipboard.writeText(text);
            showToast("¡Enlace copiado! Envíalo a tus amigos.");
        });

        // 5. Fullscreen
        document.getElementById('hud-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // --- INPUTS AL SERVIDOR (Solo si no es espectador) ---
        function sendInput(data) {
            if (ws && ws.readyState === WebSocket.OPEN && isPlaying && !isSpectatorMode) {
                ws.send(JSON.stringify(data));
            }
        }

        canvas.addEventListener('mousemove', (e) => {
            if (!isPlaying || isSpectatorMode) return;
            sendInput({ type: "mousemove", dx: e.movementX, dy: e.movementY });
        });
        canvas.addEventListener('mousedown', (e) => {
            if (!isPlaying || isSpectatorMode) return;
            e.preventDefault(); sendInput({ type: "mousedown", button: e.button });
        });
        canvas.addEventListener('mouseup', (e) => {
            if (!isPlaying || isSpectatorMode) return;
            e.preventDefault(); sendInput({ type: "mouseup", button: e.button });
        });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('keydown', (e) => {
            if (!isPlaying || isSpectatorMode) return;
            // Evitar comportamiento por defecto de f11, etc. a menos que sea necesario
            if(e.key !== 'F11' && e.key !== 'F12') e.preventDefault(); 
            sendInput({ type: "keydown", key: e.key });
        });
        window.addEventListener('keyup', (e) => {
            if (!isPlaying || isSpectatorMode) return;
            e.preventDefault(); sendInput({ type: "keyup", key: e.key });
        });

    </script>
</body>
</html>
